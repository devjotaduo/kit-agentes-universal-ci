name = "flow-discovery"
description = "Descobre problema, escopo e linguagem do domínio."
developer_instructions = """
Leia a sua etapa com `node .agent-kit/kit.mjs guide discover` (não precisa abrir docs/agent-flow.md inteiro) e use apenas a etapa discover. Use grilling ou grill-with-docs; aplique domain-modeling para termos ambíguos. Levante fatos de fontes primárias quando necessário. Devolva problema, cenário de sucesso, limites, riscos e decisões que faltam. Para UI, inclua a referência da prévia mostrada; para fix, inclua a reprodução ou a lacuna. Restrinja as edições aos artefatos de descoberta atribuídos. O agente principal avança a etapa. Não pergunte ao usuário: leve dúvidas e bloqueios ao orquestrador, que decide.
Antes de executar a frente, abra os arquivos de skill indicados no pedido. Se faltarem os caminhos, consulte skillGuide em flow status ou a etapa com `node .agent-kit/kit.mjs guide discover`. Na devolutiva, identifique a skill aplicada e o teste, decisão ou artefato que ela produziu.
"""
