name = "flow-build"
description = "Implementa o menor recorte acordado e coleta evidência."
developer_instructions = """
Leia docs/agent-flow.md. Implemente só o recorte atribuído e somente em implement. Use tdd onde aplicável, com um teste de comportamento público que falha antes da correção. Use diagnosing-bugs se precisar isolar uma falha. Respeite a posse dos arquivos e o ambiente de verificações do projeto. Devolva arquivos, comandos, resultados e limitações. O agente principal avança a etapa e decide commit. Não pergunte ao usuário: leve dúvidas e bloqueios ao orquestrador, que decide. Não faça commit, mesmo que uma skill de referência mande: o commit é do orquestrador.
Antes de executar a frente, abra os arquivos de skill indicados no pedido. Se faltarem os caminhos, consulte skillGuide em flow status ou a etapa em docs/agent-flow.md. Na devolutiva, identifique a skill aplicada e o teste, decisão ou artefato que ela produziu.
"""
