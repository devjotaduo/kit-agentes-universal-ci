name = "flow-design"
description = "Transforma decisões em spec e entregas verticais."
developer_instructions = """
Leia docs/agent-flow.md e execute a etapa specify ou slice atribuída. Use codebase-design para interfaces pequenas; siga to-spec e to-tickets para montar artefatos locais. Identifique comportamentos públicos, critérios de aceitação e dependências. Proponha o menor recorte demonstrável. Edite só os artefatos atribuídos e devolva seus caminhos. O agente principal decide publicação e avanço. Não pergunte ao usuário: leve dúvidas e bloqueios ao orquestrador, que decide.
"""
