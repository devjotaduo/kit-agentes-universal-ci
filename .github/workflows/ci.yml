# CI do Kit Universal de agentes. Este repositório guarda só este workflow: o código testado é baixado do
# repositório privado, no commit informado, com um token de curta duração do GitHub App kit-agentes-ci,
# e o resultado volta para aquele commit como check run "ci-publico", publicado pelo mesmo App.
#
# A chave do App só existe nos jobs "start", "fetch" e "report", que não executam nada do commit. Os jobs que executam
# o código ("test" e "ai-rulez") recebem os arquivos por artefato e não referenciam nenhum segredo: um teste
# malicioso não tem chave nem token para ler da memória do runner.
# O artefato fica visível neste repositório público por um dia: é o mesmo subconjunto que antes era commitado aqui.
name: ci
run-name: ci ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit do repositório privado (40 caracteres hexadecimais)
        required: true
permissions: {}
env:
  SOURCE_OWNER: jotaduo2-eng
  SOURCE_REPO: kit-agentes-universal
  APP_ID: 5895369
jobs:
  # Abre o check "ci-publico" como em andamento, para o PR mostrar a execução desde o começo. Não baixa nem executa o código.
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ci
    outputs:
      check: ${{ steps.check.outputs.id }}
    steps:
      - name: Conferir o commit informado
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha inválido"; exit 1; }'
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.KIT_CI_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_OWNER }}
          repositories: ${{ env.SOURCE_REPO }}
          permission-checks: write
      - name: Abrir o check run
        id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          id="$(gh api "repos/$SOURCE_OWNER/$SOURCE_REPO/check-runs" \
            -f name=ci-publico -f head_sha="$SHA" -f status=in_progress -f details_url="$RUN_URL" \
            -f "output[title]=node --test (Linux e Windows) e ai-rulez" \
            -f "output[summary]=Em andamento." --jq .id)"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "resposta sem id do check"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
  # Único job que lê o repositório privado. Não executa nada do que baixa.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ci
    steps:
      - name: Conferir o commit informado
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha inválido"; exit 1; }'
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.KIT_CI_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_OWNER }}
          repositories: ${{ env.SOURCE_REPO }}
          permission-contents: read
      # Só o que os testes precisam; planos e README não entram.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SOURCE_OWNER }}/${{ env.SOURCE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          path: src
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /template/
            /examples/
            /scripts/medir-uso.mjs
            /scripts/vigia-fornecedores.mjs
            /scripts/publish-release.mjs
            /install.mjs
            /.gitignore
            /CHANGELOG.md
            /*.test.mjs
            # simulacoes-harness.test.mjs exige simulacoes/isolado.sh e o Concord real no CI: roda em job próprio.
            !/simulacoes-harness.test.mjs
      - name: Conferir que os testes vieram
        run: ls src/*.test.mjs > /dev/null && test -f src/install.mjs && test -d src/template
      # O upload segue links: um link no commit levaria arquivos do runner, ou o .git, para o artefato público.
      - name: Recusar link simbólico no commit
        run: '[ -z "$(find src -path src/.git -prune -o -type l -print)" ] || { echo "link simbólico no commit"; exit 1; }'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fonte
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            src/
            !src/.git/
  test:
    needs: fetch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fonte
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Os testes criam repositórios e commits em pastas temporárias e esperam rodar dentro de um repositório.
      - shell: bash
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
          git init -q && git add -A && git commit -q -m "ci: ${{ github.run_id }}"
          ls *.test.mjs > /dev/null
      - run: node --test
  # Regras, skills e configurações dos agentes, conferidas pelo ai-rulez (versão fixa).
  ai-rulez:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fonte
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Fora de um repositório git o ai-rulez não acha nada.
      - run: git init -q
      - run: npx -y ai-rulez@5.13.4 scan --fail-on threat
        working-directory: template
      - run: npx -y ai-rulez@5.13.4 validate --fail-on error
        working-directory: template
  # Publica o resultado no commit do repositório privado. Este job não baixa nem executa o código testado.
  report:
    needs: [start, fetch, test, ai-rulez]
    # Roda sempre, para o check aberto pelo "start" não ficar em andamento: cancelamento publica cancelled
    # (que não satisfaz o check exigido) e falha em qualquer job publica failure.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ci
    steps:
      - name: Conferir o commit informado
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha inválido"; exit 1; }'
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.KIT_CI_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_OWNER }}
          repositories: ${{ env.SOURCE_REPO }}
          permission-checks: write
      - name: Publicar o check run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ inputs.sha }}
          OK: ${{ needs.fetch.result == 'success' && needs.test.result == 'success' && needs.ai-rulez.result == 'success' }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          CHECK: ${{ needs.start.outputs.check }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY: "node --test: ${{ needs.test.result }}; ai-rulez: ${{ needs.ai-rulez.result }}"
        run: |
          conclusion=failure
          [ "$CANCELLED" = "true" ] && conclusion=cancelled
          [ "$OK" = "true" ] && conclusion=success
          # Conclui o check aberto pelo "start"; se ele não abriu, cria um já concluído.
          # O head_sha só existe na criação: a atualização não muda o commit do check.
          target=(-X POST "repos/$SOURCE_OWNER/$SOURCE_REPO/check-runs" -f head_sha="$SHA")
          if [[ "$CHECK" =~ ^[0-9]+$ ]]; then target=(-X PATCH "repos/$SOURCE_OWNER/$SOURCE_REPO/check-runs/$CHECK"); fi
          # Até 3 tentativas: um erro passageiro da API deixaria o check aberto pelo "start" em andamento.
          for try in 1 2 3; do
            gh api "${target[@]}" \
              -f name=ci-publico -f status=completed -f conclusion="$conclusion" \
              -f details_url="$RUN_URL" \
              -f "output[title]=node --test (Linux e Windows) e ai-rulez" \
              -f "output[summary]=$SUMMARY" > /dev/null && break
            [ "$try" = 3 ] && { echo "não foi possível concluir o check ci-publico"; exit 1; }
            sleep 10
          done
          echo "ci-publico: $conclusion em $SHA"
